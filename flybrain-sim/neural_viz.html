<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fly-brain · neural circuit</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #08080c; overflow: hidden; }
canvas { display: block; }
#status { position: fixed; bottom: 10px; left: 12px; font: 11px/1.5 monospace; color: #333; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">connecting…</div>
<script>
"use strict";
const WS_URL   = "ws://localhost:8765";
const MAX_RATE = 8.0;

const canvas = document.getElementById("c");
const ctx    = canvas.getContext("2d");

// Logical design space — all positions are in these units
const LW = 900, LH = 540;
let sx = 1, sy = 1, ox = 0, oy = 0;

function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    const s = Math.min(canvas.width / LW, canvas.height / LH);
    sx = sy = s;
    ox = (canvas.width  - LW * s) / 2;
    oy = (canvas.height - LH * s) / 2;
}
window.addEventListener("resize", resize);
resize();

const lx = x => ox + x * sx;
const ly = y => oy + y * sy;

// ── node definitions ─────────────────────────────────────────────────────────
// rgb: base color; get(state) → 0..1 brightness
const NODES = [
    // Sensors
    { id: "t4a_l",   label: "T4a L",   x:  80, y:  90, rgb: [ 50, 120, 255], get: s => (s.neural_groups?.t4a_l   ?? 0) / MAX_RATE },
    { id: "t4a_r",   label: "T4a R",   x:  80, y: 165, rgb: [ 50, 120, 255], get: s => (s.neural_groups?.t4a_r   ?? 0) / MAX_RATE },
    { id: "mech_l",  label: "Mech L",  x:  80, y: 440, rgb: [ 90,  50, 220], get: s => Math.min(1, (s.mech_left  ?? 0)) },
    { id: "mech_r",  label: "Mech R",  x:  80, y: 505, rgb: [ 90,  50, 220], get: s => Math.min(1, (s.mech_right ?? 0)) },
    // Optic pathway
    { id: "lc4_l",   label: "LC4 L",   x: 290, y:  90, rgb: [255, 150,  20], get: s => (s.neural_groups?.lc4_l   ?? 0) / MAX_RATE },
    { id: "lc4_r",   label: "LC4 R",   x: 290, y: 165, rgb: [255, 150,  20], get: s => (s.neural_groups?.lc4_r   ?? 0) / MAX_RATE },
    { id: "lplc2_l", label: "LPLC2 L", x: 290, y: 255, rgb: [255, 210,  40], get: s => (s.neural_groups?.lplc2_l ?? 0) / MAX_RATE },
    { id: "lplc2_r", label: "LPLC2 R", x: 290, y: 330, rgb: [255, 210,  40], get: s => (s.neural_groups?.lplc2_r ?? 0) / MAX_RATE },
    // Steering DNs
    { id: "dna02_l", label: "DNa02 L", x: 530, y:  90, rgb: [ 30, 220,  90], get: s => (s.neural_groups?.dna02_l ?? s.left_rate  ?? 0) / MAX_RATE },
    { id: "dna02_r", label: "DNa02 R", x: 530, y: 165, rgb: [ 30, 220,  90], get: s => (s.neural_groups?.dna02_r ?? s.right_rate ?? 0) / MAX_RATE },
    { id: "dnp04_l", label: "DNp04 L", x: 530, y: 255, rgb: [ 50, 200, 180], get: s => Math.max(0, (s.neural_groups?.dnp04_l ?? 0) - (s.dnp04_baseline ?? 4.0)) / 4.0 },
    { id: "dnp04_r", label: "DNp04 R", x: 530, y: 330, rgb: [ 50, 200, 180], get: s => Math.max(0, (s.neural_groups?.dnp04_r ?? 0) - (s.dnp04_baseline ?? 4.0)) / 4.0 },
    // Escape DNs
    { id: "dnp01_l", label: "DNp01 L", x: 750, y:  90, rgb: [255,  50,  50], get: s => Math.max(0, (s.neural_groups?.dnp01_l ?? s.contact_dn?.dnp01_left  ?? 0) - (s.dnp01_baseline ?? 4.0)) / 4.0 },
    { id: "dnp01_r", label: "DNp01 R", x: 750, y: 165, rgb: [255,  50,  50], get: s => Math.max(0, (s.neural_groups?.dnp01_r ?? s.contact_dn?.dnp01_right ?? 0) - (s.dnp01_baseline ?? 4.0)) / 4.0 },
    { id: "dng29_l", label: "DNg29 L", x: 750, y: 440, rgb: [200,  50, 255], get: s => (s.neural_groups?.dng29_l ?? s.contact_dn?.dng29_left  ?? 0) / MAX_RATE },
    { id: "dng29_r", label: "DNg29 R", x: 750, y: 505, rgb: [200,  50, 255], get: s => (s.neural_groups?.dng29_r ?? s.contact_dn?.dng29_right ?? 0) / MAX_RATE },
];
const NODE_MAP = Object.fromEntries(NODES.map(n => [n.id, n]));

// ── edges: [fromId, toId, opacityMult] ───────────────────────────────────────
// Opacity is source-node brightness × mult, so strong signals produce vivid lines.
const EDGES = [
    ["t4a_l",   "lc4_l",   1.0],
    ["t4a_r",   "lc4_r",   1.0],
    ["t4a_l",   "lplc2_l", 0.55],
    ["t4a_r",   "lplc2_r", 0.55],
    ["lc4_l",   "dna02_l", 1.0],
    ["lc4_r",   "dna02_r", 1.0],
    ["lc4_l",   "dnp04_l", 0.9],
    ["lc4_r",   "dnp04_r", 0.9],
    ["lplc2_l", "dnp01_l", 1.0],
    ["lplc2_r", "dnp01_r", 1.0],
    ["lplc2_l", "dnp01_r", 0.22],   // cross-hemisphere
    ["lplc2_r", "dnp01_l", 0.22],
    ["mech_l",  "dng29_l", 1.0],
    ["mech_r",  "dng29_r", 1.0],
];

// ── drawing ──────────────────────────────────────────────────────────────────
const NODE_R = 20; // logical-px radius

function drawNode(node, state) {
    const v  = Math.min(1, Math.max(0, node.get(state)));
    const cx = lx(node.x), cy = ly(node.y);
    const r  = NODE_R * sx;
    const [R, G, B] = node.rgb;
    const alpha = 0.25 + v * 0.75;

    // Outer glow
    if (v > 0.04) {
        const g = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r * 4.2);
        g.addColorStop(0, `rgba(${R},${G},${B},${(v * 0.28).toFixed(3)})`);
        g.addColorStop(1, `rgba(${R},${G},${B},0)`);
        ctx.beginPath();
        ctx.arc(cx, cy, r * 4.2, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
    }

    // Circle fill
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${R},${G},${B},${(0.06 + v * 0.22).toFixed(3)})`;
    ctx.fill();

    // Ring
    ctx.strokeStyle = `rgba(${R},${G},${B},${alpha.toFixed(3)})`;
    ctx.lineWidth = 1.5 + v * 1.5;
    ctx.stroke();

    // Spike count inside
    const sc = Math.round(node.get(state) * MAX_RATE);
    if (sc > 0) {
        ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
        ctx.font = `bold ${Math.max(9, Math.round(r * 0.65))}px monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(sc, cx, cy);
    }

    // Name label below circle
    ctx.fillStyle = `rgba(160,160,160,${(0.35 + v * 0.45).toFixed(3)})`;
    ctx.font = `${Math.max(8, Math.round(r * 0.55))}px monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(node.label, cx, cy + r + 3 * sx);
}

function drawEdge(fromId, toId, mult, state) {
    const a = NODE_MAP[fromId], b = NODE_MAP[toId];
    const v = Math.min(1, Math.max(0, a.get(state))) * mult;
    if (v < 0.02) return;
    const [R, G, B] = a.rgb;
    const ax = lx(a.x), ay = ly(a.y), bx = lx(b.x), by = ly(b.y);
    // Slight downward bow on the control point keeps parallel lines visually distinct
    const cpx = (ax + bx) / 2;
    const cpy = (ay + by) / 2 + 18 * sx;
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(cpx, cpy, bx, by);
    ctx.strokeStyle = `rgba(${R},${G},${B},${(v * 0.5).toFixed(3)})`;
    ctx.lineWidth = 0.7 + v * 2.3;
    ctx.stroke();
}

function drawChrome() {
    const colHeaders = [
        { x:  80, label: "SENSORS" },
        { x: 290, label: "OPTIC PATHWAY" },
        { x: 530, label: "MOTOR DN · steer" },
        { x: 750, label: "MOTOR DN · escape" },
    ];
    ctx.fillStyle = "#252530";
    ctx.font = `${Math.max(9, Math.round(11 * sx))}px monospace`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    for (const h of colHeaders) ctx.fillText(h.label, lx(h.x), ly(8));

    // Dashed separator between visual and mechanosensory sections
    ctx.strokeStyle = "#141420";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 7]);
    ctx.beginPath();
    ctx.moveTo(lx(12), ly(400));
    ctx.lineTo(lx(LW - 12), ly(400));
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#1c1c28";
    ctx.font = `${Math.max(8, Math.round(9 * sx))}px monospace`;
    ctx.textAlign = "left";
    ctx.fillText("▲ visual", lx(15), ly(382));
    ctx.fillText("▼ mechanosensory", lx(15), ly(408));
}

// Minimap of fly world in bottom-right corner
function drawMini(state) {
    if (!state.x) return;
    const W = state.width || 800, H = state.height || 600;
    const mw = 120 * sx, mh = mw * H / W;
    const mx = lx(LW) - mw - 8 * sx, my = ly(LH) - mh - 8 * sy;

    ctx.fillStyle = "#0d0d14";
    ctx.fillRect(mx, my, mw, mh);
    ctx.strokeStyle = "#1e1e2e";
    ctx.lineWidth = 1;
    ctx.strokeRect(mx, my, mw, mh);

    if (state.obstacles) {
        ctx.fillStyle = "#1a1a28";
        for (const o of state.obstacles) {
            const ox2 = mx + (o.cx / W) * mw, oy2 = my + (o.cy / H) * mh;
            ctx.beginPath();
            ctx.arc(ox2, oy2, (o.r / W) * mw, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    const fx = mx + (state.x / W) * mw, fy = my + (state.y / H) * mh;
    ctx.beginPath();
    ctx.arc(fx, fy, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = "#3878ff";
    ctx.fill();

    const hl = 7;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + Math.cos(state.heading || 0) * hl, fy + Math.sin(state.heading || 0) * hl);
    ctx.strokeStyle = "#5a90ff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = "#282838";
    ctx.font = `${Math.max(8, Math.round(9 * sx))}px monospace`;
    ctx.textAlign = "left";
    ctx.fillText(
        `spd ${(state.speed || 0).toFixed(0)}  fr ${state.frame ?? 0}`,
        mx, my - 13 * sy,
    );
}

// ── render loop ──────────────────────────────────────────────────────────────
let state = {};

function frame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#08080c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawChrome();
    for (const [f, t, m] of EDGES) drawEdge(f, t, m, state);
    for (const node of NODES)       drawNode(node, state);
    drawMini(state);

    requestAnimationFrame(frame);
}

// ── WebSocket ────────────────────────────────────────────────────────────────
let ws;
const statusEl = document.getElementById("status");

function connect() {
    statusEl.textContent = "connecting…";
    ws = new WebSocket(WS_URL);
    ws.onopen    = () => { statusEl.textContent = "connected"; };
    ws.onclose   = () => { statusEl.textContent = "disconnected — retrying…"; setTimeout(connect, 1500); };
    ws.onerror   = () => { ws.close(); };
    ws.onmessage = e  => { try { state = JSON.parse(e.data); } catch (_) {} };
}

connect();
frame();
</script>
</body>
</html>
