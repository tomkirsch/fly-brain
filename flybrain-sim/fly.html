<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fly brain</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #ccc; font-family: monospace; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px;
    font-size: 11px; line-height: 1.6;
    background: rgba(0,0,0,0.6); padding: 8px 12px;
    border: 1px solid #333; border-radius: 4px;
  }
  #hud input[type=range] { width: 100px; vertical-align: middle; cursor: pointer; }
  #status {
    position: fixed; bottom: 12px; left: 12px;
    font-size: 11px; color: #555;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>pos <span id="pos">—</span></div>
  <div>heading <span id="hdg">—</span></div>
  <div>speed <span id="spd">—</span></div>
  <div>L <span id="lrate">—</span>  R <span id="rrate">—</span></div>
  <div>loom L <span id="ll">—</span>  R <span id="lr">—</span></div>
  <div style="margin-top:6px">
    turn gain <input type="range" id="tg" min="0" max="4" step="0.05" value="0.75">
    <span id="tgval">0.75</span>
  </div>
</div>
<div id="status">connecting…</div>
<div id="fps" style="position:fixed;bottom:12px;right:12px;font-size:11px;font-family:monospace;color:#555;background:rgba(0,0,0,0.5);padding:4px 8px;border-radius:4px"></div>

<script>
const WS_URL = "ws://localhost:8765";
const TRAIL_LEN = 400;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });

let W = 800, H = 600;
let state = null;
let pendingMsg = null;  // latest unprocessed WS payload
let trail = new Array(TRAIL_LEN).fill(null);
let trailHead = 0;   // next write index
let trailLen  = 0;   // number of valid entries
let connected = false;
let _rafTimes = [];
let _fpsEl = null;

// Interpolation between WS updates so the fly moves smoothly at 60fps
// even when the sim sends updates at only 1-6fps.
let fromState = null;
let toState   = null;
let lastUpdateTime = 0;
let updateInterval = 200; // ms, rolling estimate of WS update period

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d >  Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return a + d * t;
}


function currentInterp() {
  if (!toState) return state;
  const elapsed_s = (Date.now() - lastUpdateTime) / 1000;
  const alpha = Math.min(1, elapsed_s / (updateInterval / 1000));
  // Dead-reckon target: where the fly should be right now based on last known velocity.
  // Lerp from our screen position at last WS update toward this moving target — corrects
  // the snap that occurs when new state arrives mid-trajectory.
  const targetX = toState.x + (toState.vx || 0) * elapsed_s;
  const targetY = toState.y + (toState.vy || 0) * elapsed_s;
  const startX = fromState ? fromState.x : toState.x;
  const startY = fromState ? fromState.y : toState.y;
  return {
    ...toState,
    x: startX + (targetX - startX) * alpha,
    y: startY + (targetY - startY) * alpha,
    heading: lerpAngle(
      fromState ? fromState.heading : toState.heading,
      toState.heading, alpha
    ),
  };
}

// ---- resize ----
function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ---- WebSocket ----
let ws;
function connect() {
  document.getElementById("status").textContent = "connecting…";
  ws = new WebSocket(WS_URL);
  ws.onopen  = () => {
    connected = true;
    document.getElementById("status").textContent = "connected";
    ws.send(JSON.stringify({ turn_gain: parseFloat(tgSlider.value) }));
  };
  ws.onclose = () => {
    connected = false;
    document.getElementById("status").textContent = "disconnected — retrying…";
    setTimeout(connect, 1500);
  };
  ws.onmessage = (e) => { pendingMsg = e.data; };
}

function processMsg(raw) {
  const now = Date.now();
  const incoming = JSON.parse(raw);
  if (incoming.width)  W = incoming.width;
  if (incoming.height) H = incoming.height;

  fromState = toState ? currentInterp() : incoming;
  if (lastUpdateTime > 0) updateInterval = (now - lastUpdateTime) * 0.7 + updateInterval * 0.3;
  lastUpdateTime = now;
  toState = incoming;
  state = incoming;

  if (incoming.x != null) {
    trail[trailHead] = { x: incoming.x, y: incoming.y };
    trailHead = (trailHead + 1) % TRAIL_LEN;
    if (trailLen < TRAIL_LEN) trailLen++;
  }
  updateHud(incoming);
}
connect();

const tgSlider = document.getElementById("tg");
const tgVal    = document.getElementById("tgval");
tgSlider.addEventListener("input", () => {
  const v = parseFloat(tgSlider.value);
  tgVal.textContent = v.toFixed(2);
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ turn_gain: v }));
  }
});

const hudPos  = document.getElementById("pos");
const hudHdg  = document.getElementById("hdg");
const hudSpd  = document.getElementById("spd");
const hudLR   = document.getElementById("lrate");
const hudRR   = document.getElementById("rrate");
const hudLL   = document.getElementById("ll");
const hudLr   = document.getElementById("lr");

function updateHud(s) {
  hudPos.textContent   = `${Math.round(s.x)}, ${Math.round(s.y)}`;
  hudHdg.textContent   = `${(s.heading * 180 / Math.PI).toFixed(1)}°`;
  hudSpd.textContent   = `${s.speed?.toFixed(1)} px/s`;
  hudLR.textContent = s.left_rate?.toFixed(1);
  hudRR.textContent = s.right_rate?.toFixed(1);
  hudLL.textContent    = s.looming_left?.toFixed(2);
  hudLr.textContent    = s.looming_right?.toFixed(2);
}

// ---- world → screen transform (center + scale to window) ----
function worldToScreen(wx, wy) {
  const scale = Math.min(canvas.width / W, canvas.height / H);
  const ox = (canvas.width  - W * scale) / 2;
  const oy = (canvas.height - H * scale) / 2;
  return { x: ox + wx * scale, y: oy + wy * scale, scale };
}

// ---- draw ----
function drawBackground() {
  const { x: ox, y: oy, scale } = worldToScreen(0, 0);
  const sw = W * scale, sh = H * scale;

  // Dark field
  ctx.fillStyle = "#0d0d0d";
  ctx.fillRect(ox, oy, sw, sh);

  // Subtle grid
  ctx.strokeStyle = "#1a1a1a";
  ctx.lineWidth = 1;
  const step = 40 * scale;
  for (let x = ox; x < ox + sw; x += step) {
    ctx.beginPath(); ctx.moveTo(x, oy); ctx.lineTo(x, oy + sh); ctx.stroke();
  }
  for (let y = oy; y < oy + sh; y += step) {
    ctx.beginPath(); ctx.moveTo(ox, y); ctx.lineTo(ox + sw, y); ctx.stroke();
  }

  // Walls
  ctx.strokeStyle = "#1a2a4a";
  ctx.lineWidth = 2;
  const m = 40 * scale;
  ctx.strokeRect(ox + m, oy + m, sw - 2*m, sh - 2*m);
}



function drawObstacles(obstacles) {
  if (!obstacles || !obstacles.length) return;
  for (const obs of obstacles) {
    const { x, y, scale } = worldToScreen(obs.cx, obs.cy);
    ctx.beginPath();
    ctx.arc(x, y, obs.r * scale, 0, Math.PI * 2);
    ctx.strokeStyle = "#1e3a6e";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}


function drawTrail() {
  if (trailLen < 2) return;
  // Read circular buffer in chronological order: oldest first
  const start = trailLen < TRAIL_LEN ? 0 : trailHead;
  // Batch into segments of uniform color to avoid per-segment state changes
  const SEGMENTS = 4;
  const perSeg = Math.floor(trailLen / SEGMENTS);
  for (let seg = 0; seg < SEGMENTS; seg++) {
    const iStart = seg * perSeg;
    const iEnd   = seg === SEGMENTS - 1 ? trailLen - 1 : iStart + perSeg;
    const alpha  = ((seg + 1) / SEGMENTS) * 0.35;
    ctx.beginPath();
    for (let i = iStart; i <= iEnd; i++) {
      const pt = trail[(start + i) % TRAIL_LEN];
      if (!pt) continue;
      const { x, y } = worldToScreen(pt.x, pt.y);
      if (i === iStart) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(60, 140, 255, ${alpha.toFixed(3)})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawFly(s) {
  const { x, y, scale } = worldToScreen(s.x, s.y);
  const h = s.heading;
  const sz = 14 * scale;
  const loomGlow = Math.max(s.looming_left || 0, s.looming_right || 0);

  // Wing beat: rate scales with speed; each side modulated by its DN rate
  const t = Date.now() / 1000;
  const baseFreq = 4 + (s.speed / 80) * 8;   // 4–12 Hz visual rate (real fly is 200Hz)
  const flapAmp  = Math.min(1, s.speed / 60) * (Math.PI / 4);  // up to 45°

  // Left DN faster → left wing beats deeper (slight differential when turning)
  const lBias = Math.min(0.3, (s.left_rate  || 0) * 0.02);
  const rBias = Math.min(0.3, (s.right_rate || 0) * 0.02);
  const flapL = Math.sin(t * baseFreq * Math.PI * 2) * (flapAmp + lBias);
  const flapR = Math.sin(t * baseFreq * Math.PI * 2) * (flapAmp + rBias);

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(h);

  // Wing pivot: at thorax, slightly back from body center
  const pivotX = -sz * 0.05;
  const wingAlpha = 0.28 + loomGlow * 0.3;
  const wingColor = `rgba(80, 160, 255, ${wingAlpha})`;

  // Left wing — rotates around pivot, sweeps up (-y) when positive flapL
  ctx.save();
  ctx.translate(pivotX, 0);
  ctx.rotate(-Math.PI / 2 + flapL);
  ctx.beginPath();
  ctx.ellipse(sz * 0.48, 0, sz * 0.58, sz * 0.2, -0.2, 0, Math.PI * 2);
  ctx.fillStyle = wingColor;
  ctx.fill();
  ctx.restore();

  // Right wing — mirrors left
  ctx.save();
  ctx.translate(pivotX, 0);
  ctx.rotate(Math.PI / 2 - flapR);
  ctx.beginPath();
  ctx.ellipse(sz * 0.48, 0, sz * 0.58, sz * 0.2, 0.2, 0, Math.PI * 2);
  ctx.fillStyle = wingColor;
  ctx.fill();
  ctx.restore();

  // Body
  ctx.beginPath();
  ctx.ellipse(0, 0, sz * 0.38, sz * 0.18, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${60 + loomGlow * 40}, ${100 + loomGlow * 40}, ${180 + loomGlow * 60})`;
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.arc(sz * 0.42, 0, sz * 0.14, 0, Math.PI * 2);
  ctx.fillStyle = "#7090e0";
  ctx.fill();

  // Eyes
  ctx.beginPath();
  ctx.arc(sz * 0.5, -sz * 0.1, sz * 0.06, 0, Math.PI * 2);
  ctx.arc(sz * 0.5,  sz * 0.1, sz * 0.06, 0, Math.PI * 2);
  ctx.fillStyle = "#ff6060";
  ctx.fill();

  ctx.restore();

  // Per-ray looming ring: 72 segments × 5° = full 360° retinotopic display.
  // Offsets 0→π = right hemifield (red), π→2π = left hemifield (green).
  // Brightness = per-ray expansion signal (what LC4/LPLC2 actually receive).
  const loomRays = s.loom_rays || [];
  const ringR = sz * 2.8;
  if (loomRays.length >= 72) {
    const BIN = 2;  // pair rays: 72 -> 36 arc calls
    const step = (2 * Math.PI) / loomRays.length;
    const LOOM_SCALE = 1.2;
    if (loomRays.some(v => v > 0.001)) {
      ctx.lineWidth = 2.5;
      for (let i = 0; i < loomRays.length; i += BIN) {
        let val = 0;
        for (let b = 0; b < BIN && i+b < loomRays.length; b++) val = Math.max(val, loomRays[i+b]);
        if (val < 0.001) continue;
        const startAngle = h + i * step;
        const isRight = (i * step) < Math.PI;
        const alpha = Math.min(0.95, (val / LOOM_SCALE) * 0.85).toFixed(2);
        ctx.beginPath();
        ctx.arc(x, y, ringR, startAngle, startAngle + step * BIN + 0.01, false);
        ctx.strokeStyle = isRight ? "rgba(255,60,60,"+alpha+")" : "rgba(60,220,80,"+alpha+")";
        ctx.stroke();
      }
    }
  }
}

// ---- render loop ----
function frame() {
  const _n = performance.now();
  _rafTimes.push(_n);
  while (_rafTimes.length > 1 && _n - _rafTimes[0] > 1000) _rafTimes.shift();
  if (!_fpsEl) _fpsEl = document.getElementById("fps");
  if (_fpsEl && _rafTimes.length > 1) {
    const rf = Math.round((_rafTimes.length-1)*1000/(_n-_rafTimes[0]));
    const wf = updateInterval > 0 ? Math.round(1000/updateInterval) : 0;
    _fpsEl.textContent = "RAF " + rf + "fps  WS " + wf + "fps";
  }
  if (pendingMsg) { processMsg(pendingMsg); pendingMsg = null; }
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackground();

  if (state) {
    const s = currentInterp();
    drawObstacles(s.obstacles);
    drawTrail();
    drawFly(s);
  } else {
    ctx.fillStyle = "#333";
    ctx.font = "14px monospace";
    ctx.fillText("waiting for brain…", canvas.width/2 - 80, canvas.height/2);
  }

  requestAnimationFrame(frame);
}

frame();
</script>
</body>
</html>
